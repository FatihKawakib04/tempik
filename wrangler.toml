name = "tempik"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Web UI/API is served from the workers.dev URL.
# (Custom domain skipped because an A record already occupies
#  mail.kodemaverick.my.id; email routing does not need it.)
workers_dev = true

# ---- D1 Database ----
# Step 1: run `npx wrangler d1 create tempik-db`
# Step 2: copy the database_id into the field below
[[d1_databases]]
binding = "DB"
database_name = "tempik-db"
database_id = "d7314464-58e8-46fb-b896-9b4054cfc684"

# ---- Email Worker ----
[email]
action = "process"

# ---- No custom-domain route ----
# Web UI + API are served from the workers.dev URL (workers_dev = true).
# Inbound email (catch-all) is received on the APEX domain
# (kodemaverick.my.id) because Cloudflare only allows catch-all
# rules on the apex, not on subdomains.

# ---- Environment variables ----
[vars]
APP_NAME = "Tempik"
MAIL_DOMAIN = "kodemaverick.my.id"
WEB_HOST = "tempik.kwkbkartono.workers.dev"

# ---- Static assets (web frontend) ----
[assets]
directory = "./src/web"

# ---- Observability ----
[observability]
enabled = true
